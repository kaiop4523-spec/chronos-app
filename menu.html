<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chronos 圖文選單產生器</title>
<style>
body{margin:0;padding:16px;font-family:-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:#f2f9fb;color:#16313a}
h1{font-size:18px}
canvas{width:100%;max-width:720px;border-radius:12px;border:1px solid #cfe3ea;display:block}
button{margin-top:14px;padding:12px 20px;font-size:16px;border:0;border-radius:10px;background:#0ea5c6;color:#fff;font-weight:700}
p{color:#5a747e;font-size:14px;max-width:720px}
</style>
</head>
<body>
<h1>Chronos 圖文選單產生器</h1>
<p>預覽沒問題就按下載，得到 2500×1686 的 PNG，再依設定清單上傳到 Google 雲端硬碟。</p>
<canvas id="c" width="2500" height="1686"></canvas>
<button id="dl">下載 PNG</button>
<script>
const W = 2500, H = 1686;
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const widths = [833, 833, 834];
const cells = [
  { e: "📝", t: "新增待辦", c: "#0ea5c6" },
  { e: "📋", t: "今日清單", c: "#14b8a6" },
  { e: "📅", t: "本週行程", c: "#0b8fb0" },
  { e: "💰", t: "本月花費", c: "#12a59a" },
  { e: "⚙️", t: "設定", c: "#0c7f9c" },
  { e: "🧭", t: "開啟控制台", c: "#0f8f86" }
];

function draw() {
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, W, H);
  cells.forEach((cell, i) => {
    const col = i % 3, row = Math.floor(i / 3);
    const x = widths.slice(0, col).reduce((s, w) => s + w, 0);
    const y = row * 843, w = widths[col], h = 843;
    ctx.fillStyle = cell.c;
    ctx.fillRect(x, y, w, h);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#ffffff";
    ctx.font = "260px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";
    ctx.fillText(cell.e, x + w / 2, y + h / 2 - 90);
    ctx.font = "bold 120px 'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif";
    ctx.fillText(cell.t, x + w / 2, y + h / 2 + 200);
  });
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.moveTo(833, 0); ctx.lineTo(833, H);
  ctx.moveTo(1666, 0); ctx.lineTo(1666, H);
  ctx.moveTo(0, 843); ctx.lineTo(W, 843);
  ctx.stroke();
}

(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(draw);
draw();

document.getElementById("dl").onclick = () => {
  cv.toBlob((b) => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(b);
    a.download = "chronos-richmenu.png";
    a.click();
  }, "image/png");
};
</script>
</body>
</html>
